<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168" role="img" aria-labelledby="t">
  <title id="t">Cycle d'une recherche en psychologie</title>
  <rect width="760" height="168" rx="12" fill="#f6f1e6"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1c2b24">
    <g>
      <rect x="16" y="36" width="128" height="72" rx="8" fill="#1b4332"/>
      <text x="80" y="68" text-anchor="middle" fill="#f6f1e6" font-size="14">1. Observer</text>
      <text x="80" y="88" text-anchor="middle" fill="#d8c9a3" font-size="11">le phénomène</text>
    </g>
    <g>
      <rect x="166" y="36" width="128" height="72" rx="8" fill="#2d6a4f"/>
      <text x="230" y="64" text-anchor="middle" fill="#f6f1e6" font-size="13">2. Hypothèses</text>
      <text x="230" y="82" text-anchor="middle" fill="#f6f1e6" font-size="11">théorie, mesure,</text>
      <text x="230" y="96" text-anchor="middle" fill="#f6f1e6" font-size="11">statistique</text>
    </g>
    <g>
      <rect x="316" y="36" width="128" height="72" rx="8" fill="#40916c"/>
      <text x="380" y="64" text-anchor="middle" fill="#f6f1e6" font-size="13">3. Vérifier</text>
      <text x="380" y="84" text-anchor="middle" fill="#f6f1e6" font-size="11">VI manipulée</text>
      <text x="380" y="98" text-anchor="middle" fill="#f6f1e6" font-size="11">VD mesurée</text>
    </g>
    <g>
      <rect x="466" y="36" width="128" height="72" rx="8" fill="#b08968"/>
      <text x="530" y="68" text-anchor="middle" fill="#1c2b24" font-size="13">4. Traiter</text>
      <text x="530" y="88" text-anchor="middle" fill="#1c2b24" font-size="11">les données</text>
    </g>
    <g>
      <rect x="616" y="36" width="128" height="72" rx="8" fill="#c4a35a"/>
      <text x="680" y="64" text-anchor="middle" fill="#1c2b24" font-size="13">5. Discuter</text>
      <text x="680" y="84" text-anchor="middle" fill="#1c2b24" font-size="11">ce qui tient,</text>
      <text x="680" y="98" text-anchor="middle" fill="#1c2b24" font-size="11">ce qui ne tient pas</text>
    </g>
    <path d="M144 72 H166 M294 72 H316 M444 72 H466 M594 72 H616" stroke="#1c2b24" stroke-width="2" fill="none"/>
    <text x="380" y="146" text-anchor="middle" font-size="13" fill="#3d4a44">Une étude est un processus : la question se précise en chemin, elle ne tombe pas toute faite.</text>
  </g>
</svg>
