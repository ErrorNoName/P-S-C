<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-labelledby="t">
  <title id="t">Mémoire transactive : le savoir et l'endroit où le chercher</title>
  <rect width="760" height="200" rx="12" fill="#f6f1e6"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1c2b24">
    <circle cx="160" cy="90" r="62" fill="#1b4332"/>
    <text x="160" y="84" text-anchor="middle" fill="#f6f1e6" font-size="14">personne A</text>
    <text x="160" y="104" text-anchor="middle" fill="#d8c9a3" font-size="12">sait une partie</text>
    <circle cx="380" cy="90" r="62" fill="#2d6a4f"/>
    <text x="380" y="84" text-anchor="middle" fill="#f6f1e6" font-size="14">personne B</text>
    <text x="380" y="104" text-anchor="middle" fill="#d8c9a3" font-size="12">sait le reste</text>
    <circle cx="600" cy="90" r="62" fill="#c4a35a"/>
    <text x="600" y="78" text-anchor="middle" fill="#1c2b24" font-size="14">externe</text>
    <text x="600" y="98" text-anchor="middle" fill="#1c2b24" font-size="12">carnet, proche,</text>
    <text x="600" y="114" text-anchor="middle" fill="#1c2b24" font-size="12">moteur de recherche</text>
    <path d="M222 90 H318 M442 90 H538" stroke="#1c2b24" stroke-width="2"/>
    <text x="380" y="178" text-anchor="middle" font-size="13">On ne retient pas tout : on retient qui, ou quoi, détient l'information (Wegner ; Sparrow, Liu et Wegner, 2011).</text>
  </g>
</svg>
