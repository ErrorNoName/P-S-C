<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Robbers Cave  deux camps, une canalisation</title>
  <desc id="desc">Schéma pédagogique : deux groupes séparés par une compétition, reliés par une conduite d'eau à réparer.</desc>
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e6d2"/>
      <stop offset="1" stop-color="#f4efe4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ciel)"/>
  <rect x="0" y="300" width="800" height="180" fill="#c9b896"/>
  <polygon points="0,300 140,210 260,300" fill="#8fa37a"/>
  <polygon points="540,300 680,190 800,300" fill="#7e9568"/>
  <circle cx="190" cy="168" r="52" fill="#e7d7a8" stroke="#5c4033" stroke-width="4"/>
  <text x="190" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5c4033">Aigles</text>
  <circle cx="610" cy="168" r="52" fill="#c9d4c4" stroke="#2f4a3a" stroke-width="4"/>
  <text x="610" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2f4a3a">Serpents</text>
  <path d="M242 188 C 300 230, 360 250, 400 255 C 440 260, 500 230, 558 188" fill="none" stroke="#6b5344" stroke-width="10" stroke-linecap="round"/>
  <path d="M242 188 C 300 230, 360 250, 400 255 C 440 260, 500 230, 558 188" fill="none" stroke="#8ec5d8" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>
  <circle cx="400" cy="258" r="16" fill="#b23a48"/>
  <path d="M392 250 l16 16 M408 250 l-16 16" stroke="#f4efe4" stroke-width="3"/>
  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4a3728">But supraordonné : la canalisation</text>
  <text x="400" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6b5344">Sherif, 1954  le contact seul ne suffit pas</text>
  <line x1="120" y1="400" x2="280" y2="400" stroke="#5c4033" stroke-width="6"/>
  <polygon points="280,390 310,400 280,410" fill="#5c4033"/>
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5c4033">compétition</text>
  <line x1="520" y1="400" x2="680" y2="400" stroke="#2f4a3a" stroke-width="6"/>
  <polygon points="520,390 490,400 520,410" fill="#2f4a3a"/>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2f4a3a">coopération</text>
</svg>
