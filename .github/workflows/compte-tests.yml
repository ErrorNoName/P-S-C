name: Tests du compte étudiant

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: API comptes (auth, notes, isolation, photo)
        working-directory: serveur-compte
        run: python3 test_compte.py
      - name: Syntaxe du client
        run: node --check assets-ebook/js/compte.js && node --check assets-ebook/js/compte-config.js
