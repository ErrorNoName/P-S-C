name: Garder l'API Render éveillée

# L'instance gratuite s'endort après ~15 min sans trafic (réveil 50 s+).
# Un GET /api/health toutes les 5 minutes empêche la mise en veille.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-api-awake.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping santé SQLite
        run: |
          set -e
          URL="https://psychopedia.onrender.com/api/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 80 "$URL" | grep -q '"ok"'; then
              echo "API éveillée"
              exit 0
            fi
            echo "tentative $i…"
            sleep 8
          done
          echo "API injoignable"
          exit 1
